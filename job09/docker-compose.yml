services:

  registry:
    image: registry:2
    container_name: job09-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: always

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: job09-registry-ui
    expose:
      - "80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Mon registre Docker
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=http://registry:5000
    depends_on:
      - registry

  registry-auth:
    image: nginx:latest
    container_name: job09-registry-auth
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth:/etc/nginx/auth:ro
    depends_on:
      - registry-ui

volumes:
  registry-data:
